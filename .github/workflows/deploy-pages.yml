name: Deploy to GitHub Pages

on:
  # 在 update job 成功推送到 master 后触发（push master 即触发本工作流）
  push:
    branches: [master]
    paths:
      - 'data/**'
      - 'index.html'
      - 'assets/**'
      - 'classic/**'

  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只有一个部署在跑
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

